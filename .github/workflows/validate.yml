name: Validate Theme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate themes
        run: scripts/validate-themes.sh

      - name: Test validation behavior
        run: scripts/test-validate-themes.sh

      - name: Upload generated themes
        uses: actions/upload-artifact@v4
        with:
          name: amberphosphor-themes
          path: |
            terminal/*.terminal
            iterm2/*.itermcolors
          if-no-files-found: error
