          -----END PGP PUBLIC KEY BLOCK-----
          EOF
          imported_fingerprint="$(gpg --with-colons --fingerprint FEA322F2C85C0E17 | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ "$imported_fingerprint" != "$EXPECTED_SIGNING_FINGERPRINT" ]]; then
            echo "Imported signing key fingerprint does not match expected release key." >&2
            echo "expected: $EXPECTED_SIGNING_FINGERPRINT" >&2
            echo "actual:   $imported_fingerprint" >&2
            exit 1
          fi
          gpg --fingerprint FEA322F2C85C0E17

      - name: Verify signed annotated tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$tag")" = "tag"
          git tag -v "$tag"
          verify_output="$(git verify-tag --raw "$tag" 2>&1)"
          if ! grep -Fq "[GNUPG:] VALIDSIG $EXPECTED_SIGNING_FINGERPRINT" <<<"$verify_output"; then
            echo "Tag signature does not match expected release key fingerprint." >&2
            echo "$verify_output" >&2
            exit 1
          fi

      - name: Validate themes
        run: scripts/validate-themes.sh

      - name: Package release archive
        id: package
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="dist/AmberPhosphor-theme-${tag}.zip"
          package_dir="$(mktemp -d)"
          release_root="${package_dir}/AmberPhosphor-theme-${tag}"

          mkdir -p "$release_root/terminal" "$release_root/iterm2" dist
          cp README.md CHANGELOG.md LICENSE "$release_root/"
          cp terminal/*.terminal terminal/install-terminal.sh "$release_root/terminal/"
          cp iterm2/*.itermcolors iterm2/install-iterm2.sh "$release_root/iterm2/"

          (cd "$package_dir" && zip -r "$GITHUB_WORKSPACE/$archive" "AmberPhosphor-theme-${tag}")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: amberphosphor-release-${{ github.ref_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="dist/AmberPhosphor-theme-${tag}.zip"
          notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
            gh release edit "$tag" --title "$tag" --notes "$notes"
          else
            gh release create "$tag" "$archive" --title "$tag" --notes "$notes"
          fi
