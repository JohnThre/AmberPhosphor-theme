name: Release Theme

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    env:
      EXPECTED_SIGNING_FINGERPRINT: 362767DE8B3309EBAA2331CDFEA322F2C85C0E17
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag name
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z with numeric components: $tag" >&2
            exit 1
          fi

      - name: Verify tag commit matches origin/main
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          git fetch origin main:refs/remotes/origin/main

          tagged_commit="$(git rev-list -n 1 "$tag")"
          origin_main_commit="$(git rev-parse origin/main)"
          if [[ "$tagged_commit" != "$origin_main_commit" ]]; then
            echo "Release tag must point at origin/main." >&2
            echo "tagged commit: $tagged_commit" >&2
            echo "origin/main:   $origin_main_commit" >&2
            exit 1
          fi

